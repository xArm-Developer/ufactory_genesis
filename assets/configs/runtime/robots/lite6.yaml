schema_version: 1
robot:
  key: lite6
  robot_name: lite6
  variant: ""
  dof: 6
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
  ee_link: link6
  assets_dir: assets/urdf/robots/lite6
  urdf: "assembly:lite6_gripper:stl"
  capabilities: [servo_j, servo_cartesian, lite6_gripper, sdk_sim, hardware_gripper]
  environment_contact_pairs: [[link_base, table]]
arm:
  default_qpos_rad: [0.0, -0.6, 0.0, 0.0, 0.6, 0.0]
  kp: [3000.0, 3000.0, 2000.0, 40.0, 80.0, 40.0]
  kv: [300.0, 300.0, 200.0, 4.0, 8.0, 4.0]
  force_lower_nm: [-81.6, -81.6, -30.6, -1.364505, -3.274812, -1.364505]
  force_upper_nm: [81.6, 81.6, 30.6, 1.364505, 3.274812, 1.364505]
  effort_limits_nm: [81.6, 81.6, 30.6, 1.364505, 3.274812, 1.364505]
gripper:
  adapter: lite6
  drive_joint: finger_joint1
  all_joint_names: [finger_joint1, finger_joint2]
  finger_link_names: [uflite_finger1, uflite_finger2]
  open_drive: 0.0089
  closed_drive: 0.0
  open_gap_m: 0.038
  closed_gap_m: 0.020
  kp: 700.0
  kv: 20.0
  force_lower_n: -3.0
  force_upper_n: 3.0
  damping: 0.05
  frictionloss: 0.0
  real_command: true
  feedback: false
  closed_loop: false
  allowed_contact_links: [uflite_finger1, uflite_finger2]
  # Genesis physics only: the finger-root boxes (URDF collision index 0; index 1 is the pad) meet when the gripper
  # closes fully, so contact between them is disabled. Safety preflight skips every pair below the flange anyway.
  excluded_geometry_pairs: [[uflite_finger1_0, uflite_finger2_0]]
  tool_tip_offset_z_m: 0.0543
  finger_pad_below_center_m: 0.021
  finger_close_descent_m: 0.0
  grasp_table_clearance_m: 0.006
  grasp_height_extra_m: 0.015
  tcp_offset: [0.0, 0.0, 75.3, 0.0, 0.0, 0.0]
