[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-ufactory"
version = "0.2.13"
description = "UFACTORY robot models and Genesis simulation utilities"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Daniel Wang", email = "daniel.wang@ufactory.cc"},
]
maintainers = [
    {name = "Daniel Wang", email = "daniel.wang@ufactory.cc"},
]
keywords = ["ufactory", "xarm", "genesis", "simulation", "robotics", "urdf", "robot-learning"]
dependencies = [
    "numpy",
    "pyyaml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/DanielWang123321/ufactory_genesis"
Repository = "https://github.com/DanielWang123321/ufactory_genesis"
Issues = "https://github.com/DanielWang123321/ufactory_genesis/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff==0.15.21",
    "mypy>=1.16",
    "pip-audit>=2.9",
    "types-PyYAML",
]
dynamics = [
    "matplotlib>=3.8",
    "pin==4.0.0",
    "coal==3.0.3",
]
real = [
    "xarm-python-sdk",
    "pin==4.0.0",
    "coal==3.0.3",
]
sim = [
    "genesis-world>=1.4.0",
    "packaging>=24",
    "torch==2.10.0",
]
rl = [
    "rsl-rl-lib>=5.3.0",
    "tensorboard",
    "huggingface_hub>=0.24",
]
showcase = [
    "scipy>=1.11",
]
# Optional trajectory-planning reference backend. The default planner/profile
# stack is pure NumPy; installing this extra enables roboticstoolbox-based
# comparison and future advanced planning adapters.
trajectory = [
    "roboticstoolbox-python>=1.3.0",
]

[project.scripts]
dynamics-sim-check = "ufactory.dynamics.cli:cli_sim_check"
dynamics-sim-collision-check = "ufactory.dynamics.cli:cli_sim_collision_check"
dynamics-hardware-check = "ufactory.dynamics.cli:cli_hardware_check"
dynamics-report-compare = "ufactory.dynamics.cli:cli_report_compare"
observe-hold-current = "ufactory.hardware.observe:cli_observe_hold_current"
ufactory-pick-place = "ufactory.cli.pick_place:main"
ufactory-packaging-showcase = "ufactory.cli.packaging:main"
project-check = "ufactory.quality.project_check:main"

[tool.coverage.run]
branch = true
source = ["ufactory"]
relative_files = true
# Fast coverage measures code that is safe and deterministic on a CPU-only
# source checkout. Optional backend adapters are covered by their owning
# sim/sdk-sim/hardware layers instead of being imported by fast tests.
omit = [
    "ufactory/cli/*",
    "ufactory/hardware/*",
    "ufactory/quality/*",
    "ufactory/safety/adapters/*",
    "ufactory/simulation/*",
    "ufactory/dynamics/cli.py",
    "ufactory/dynamics/plot.py",
    "ufactory/dynamics/probe.py",
    "ufactory/dynamics/reference.py",
    "ufactory/grippers/bio_g2.py",
    "ufactory/grippers/lite6.py",
    "ufactory/kinematics/genesis.py",
    "ufactory/kinematics/validation.py",
    "ufactory/manipulation/packaging/drop.py",
    "ufactory/manipulation/packaging/scene.py",
    "ufactory/manipulation/packaging/simulation.py",
    "ufactory/robots/paths.py",
    "ufactory/robots/runtime.py",
    "ufactory/trajectory/backends.py",
    "ufactory/trajectory/ik.py",
    "ufactory/trajectory/mirror_executor.py",
    "ufactory/trajectory/real_executor.py",
    "ufactory/trajectory/scene.py",
    "ufactory/trajectory/sim_executor.py",
    "ufactory/trajectory/mirror_process.py",
    "ufactory/training/logic/*",
    "ufactory/training/legacy_warm_start.py",
    "ufactory/training/models.py",
    "ufactory/training/transfer.py",
    "ufactory/visualization/bio_gripper_g2_viewer.py",
    "ufactory/visualization/gripper_g2_viewer.py",
    "ufactory/visualization/lite6_gripper_viewer.py",
    "ufactory/visualization/robot_viewer.py",
    "ufactory/visualization/standalone_gripper.py",
    "ufactory/visualization/viewer.py",
    "ufactory/visualization/glb.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E741"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

# Source delivery policy: only a cloned repository plus ``pip install -e .``
# is supported. Wheels/sdists and remote asset downloads are intentionally not
# part of v0.2.x; discover_asset_store fails closed outside a source checkout.
# PackageAssetStore is the 0.3.x extension point and is not populated yet.

[tool.setuptools.packages.find]
where = ["."]
include = ["ufactory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = ["dev"]
markers = [
    "hardware: tests requiring xArm SDK or real robot network",
    "gpu: in-process Genesis GPU simulation",
    "integration: end-to-end subprocess smoke tests (examples)",
    "display: subprocess tests requiring DISPLAY for visual dry-run",
    "slow: full multi-robot/multi-cycle matrices; excluded from project-check sim",
]
